[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finflow"
version = "0.1.0"
description = "A Python application for processing financial operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]